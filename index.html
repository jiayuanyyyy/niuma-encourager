<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171815">
  <title>牛马鼓励器｜今天又赚了一点</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171815;
      --ink-soft: #55584f;
      --paper: #f3f1e9;
      --card: #fffef8;
      --line: rgba(23, 24, 21, 0.14);
      --lime: #c9ff4a;
      --lime-deep: #aee632;
      --orange: #ff7a45;
      --yellow: #ffd84d;
      --shadow: 0 20px 60px rgba(35, 38, 26, 0.10);
      --radius-lg: 32px;
      --radius-md: 22px;
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: var(--font);
      background:
        radial-gradient(circle at 12% 16%, rgba(201, 255, 74, 0.20), transparent 28rem),
        radial-gradient(circle at 91% 88%, rgba(255, 122, 69, 0.12), transparent 30rem),
        var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(23, 24, 21, 0.22);
      outline-offset: 3px;
    }

    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 54px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1.5px solid var(--ink);
      border-radius: 13px;
      background: var(--lime);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 21px;
      transform: rotate(-3deg);
    }

    .settings-button,
    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background: rgba(255, 254, 248, 0.72);
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }

    .settings-button:hover,
    .icon-button:hover {
      background: var(--card);
      transform: translateY(-2px);
    }

    .settings-button {
      min-height: 46px;
      gap: 8px;
      padding: 0 18px;
      border-radius: 999px;
      font-weight: 700;
    }

    .settings-button svg {
      width: 18px;
      height: 18px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(310px, 0.82fr);
      gap: 58px;
      align-items: end;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 17px;
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 6px rgba(255, 122, 69, 0.13);
    }

    .status-dot.is-active {
      background: #56a839;
      box-shadow: 0 0 0 6px rgba(86, 168, 57, 0.13);
      animation: breathe 2s ease-in-out infinite;
    }

    @keyframes breathe {
      50% { transform: scale(0.72); }
    }

    h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(46px, 7.2vw, 90px);
      line-height: 0.98;
      letter-spacing: -0.065em;
    }

    h1 .accent {
      position: relative;
      display: inline;
      padding: 0 0.04em;
      background: linear-gradient(transparent 70%, var(--lime) 70%, var(--lime) 94%, transparent 94%);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      z-index: 0;
    }

    h1 .accent::after {
      content: none;
    }

    .mobile-break {
      display: none;
    }

    .hero-copy {
      margin: 25px 0 0;
      color: var(--ink-soft);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.7;
    }

    .hero-copy strong {
      color: var(--ink);
    }

    .sticker {
      position: relative;
      min-height: 250px;
      overflow: hidden;
      padding: 34px;
      border: 1.5px solid var(--ink);
      border-radius: var(--radius-lg);
      background: var(--lime);
      box-shadow: 8px 8px 0 var(--ink);
      transform: rotate(1.5deg);
    }

    .sticker::before,
    .sticker::after {
      position: absolute;
      border: 2px solid var(--ink);
      border-radius: 50%;
      content: "";
      opacity: 0.14;
    }

    .sticker::before {
      width: 150px;
      height: 150px;
      right: -55px;
      top: -60px;
    }

    .sticker::after {
      width: 80px;
      height: 80px;
      right: 48px;
      bottom: -46px;
    }

    .sticker-kicker {
      margin: 0 0 24px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .sticker-quote {
      position: relative;
      max-width: 340px;
      margin: 0;
      font-size: clamp(27px, 3.2vw, 40px);
      font-weight: 850;
      line-height: 1.18;
      letter-spacing: -0.045em;
      z-index: 1;
    }

    .sticker-footer {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-top: 31px;
    }

    .sticker-time {
      font-size: 13px;
      font-weight: 750;
    }

    .faces {
      font-size: 30px;
      letter-spacing: -8px;
      filter: grayscale(1) contrast(1.3);
    }

    .earnings-card {
      margin-top: 76px;
      padding: clamp(26px, 4vw, 50px);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 254, 248, 0.92);
      box-shadow: var(--shadow);
    }

    .earnings-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .amount-label-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
    }

    .amount-label {
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 750;
    }

    .privacy-button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 29px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
    }

    .privacy-button:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    .privacy-button svg {
      width: 15px;
      height: 15px;
    }

    .amount {
      margin: 0;
      font-variant-numeric: tabular-nums;
      font-size: clamp(42px, 7.3vw, 82px);
      font-weight: 850;
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .amount .currency {
      margin: 0 0.08em 0.08em;
      font-size: 0.52em;
      letter-spacing: -0.02em;
      vertical-align: 0.13em;
    }

    .percent-chip {
      flex: 0 0 auto;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      font-size: 14px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .earnings-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap;
    }

    .demo-button {
      min-height: 38px;
      padding: 0 14px;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      background: var(--lime);
      box-shadow: 2px 2px 0 var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 850;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .demo-button:hover {
      transform: translateY(-1px);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .demo-button[aria-pressed="true"] {
      background: var(--yellow);
    }

    .earnings-card.is-simulating .progress-fill,
    .earnings-card.is-simulating .progress-runner {
      transition-duration: 90ms;
      transition-timing-function: linear;
    }

    .progress-wrap {
      --regular-share: 100%;
      margin-top: 45px;
    }

    .progress-track {
      position: relative;
      height: 24px;
      overflow: visible;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      background: #e7e5dc;
      box-shadow: inset 0 2px 4px rgba(23, 24, 21, 0.08);
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      overflow: hidden;
      border-radius: inherit;
      background: var(--lime);
      transition: width 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-overtime-fill {
      right: auto;
      left: var(--regular-share);
      border-radius: 0 999px 999px 0;
      background: var(--orange);
    }

    .earnings-card.is-in-overtime .progress-fill:not(.progress-overtime-fill) {
      border-radius: 999px 0 0 999px;
    }

    .progress-fill::after {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(135deg, transparent 0 8px, rgba(23, 24, 21, 0.09) 8px 12px);
      content: "";
    }

    .progress-runner {
      position: absolute;
      top: 50%;
      left: 0%;
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--card);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 20px;
      transform: translate(-50%, -50%);
      transition: left 700ms cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 2;
    }

    .progress-marker {
      position: absolute;
      top: -7px;
      bottom: -7px;
      left: var(--regular-share);
      width: 2px;
      border-radius: 999px;
      background: var(--ink);
      transform: translateX(-1px);
      z-index: 1;
    }

    .progress-times {
      position: relative;
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .normal-end-time {
      position: absolute;
      left: var(--regular-share);
      white-space: nowrap;
      transform: translateX(-50%);
    }

    .progress-times > span:last-child {
      margin-left: auto;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 30px;
    }

    .metric {
      min-width: 0;
      padding: 19px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--paper);
    }

    .metric-label {
      display: block;
      margin-bottom: 7px;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .metric-value {
      display: block;
      overflow: hidden;
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .footnote {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 22px 4px 0;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.6;
    }

    .local-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .local-tag svg {
      width: 14px;
      height: 14px;
    }

    dialog {
      width: min(520px, calc(100% - 28px));
      max-width: none;
      margin: auto;
      padding: 0;
      overflow: visible;
      border: 0;
      border-radius: 30px;
      background: transparent;
      color: var(--ink);
    }

    dialog::backdrop {
      background: rgba(20, 22, 18, 0.56);
      backdrop-filter: blur(8px);
    }

    .modal-card {
      max-height: calc(100vh - 28px);
      overflow-x: hidden;
      overflow-y: auto;
      border: 1.5px solid var(--ink);
      border-radius: 30px;
      background: var(--card);
      box-shadow: 10px 10px 0 rgba(23, 24, 21, 0.75);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 25px 27px 20px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      margin: 0;
      font-size: 23px;
      letter-spacing: -0.03em;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
      font-size: 23px;
      line-height: 1;
    }

    .settings-form {
      padding: 26px 27px 28px;
    }

    .field {
      display: grid;
      gap: 9px;
      margin-bottom: 22px;
    }

    .field-label {
      font-size: 14px;
      font-weight: 800;
    }

    .salary-input-wrap {
      position: relative;
    }

    .salary-prefix {
      position: absolute;
      top: 50%;
      left: 17px;
      color: var(--ink-soft);
      font-weight: 800;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1.5px solid var(--line);
      border-radius: 15px;
      background: var(--paper);
      color: var(--ink);
      font-size: 17px;
      font-weight: 750;
      transition: border-color 180ms ease, background 180ms ease;
    }

    .salary-input-wrap .form-input {
      padding-left: 38px;
    }

    .form-input:hover,
    .form-input:focus {
      border-color: var(--ink);
      background: var(--card);
    }

    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .overtime-card {
      margin: 1px 0 22px;
      padding: 17px;
      border: 1.5px solid var(--line);
      border-radius: 17px;
      background: var(--paper);
    }

    .overtime-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
    }

    .overtime-toggle-copy {
      display: grid;
      gap: 4px;
    }

    .overtime-toggle-copy strong {
      font-size: 14px;
    }

    .overtime-toggle-copy small {
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.45;
    }

    .switch-input {
      width: 48px;
      height: 28px;
      flex: 0 0 auto;
      margin: 0;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      appearance: none;
      background: #d7d5cb;
      cursor: pointer;
      transition: background 180ms ease;
    }

    .switch-input::before {
      display: block;
      width: 20px;
      height: 20px;
      margin: 2.5px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--card);
      content: "";
      transition: transform 180ms ease;
    }

    .switch-input:checked {
      background: var(--orange);
    }

    .switch-input:checked::before {
      transform: translateX(19px);
    }

    .overtime-fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(120px, 0.72fr);
      gap: 14px;
      align-items: end;
      margin-top: 17px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
    }

    .overtime-fields[hidden] {
      display: none;
    }

    .overtime-explain {
      margin: 0;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.55;
    }

    .compact-field {
      gap: 7px;
      margin: 0;
    }

    .field-help,
    .form-error {
      margin: -1px 0 0;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.5;
    }

    .form-error {
      min-height: 18px;
      margin-top: -9px;
      color: #b8351d;
      font-weight: 700;
    }

    .preview-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 3px 0 24px;
      padding: 16px 17px;
      border-radius: 16px;
      background: rgba(201, 255, 74, 0.36);
      font-size: 13px;
      font-weight: 700;
    }

    .preview-box strong {
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }

    .form-actions {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 12px;
    }

    .button {
      min-height: 52px;
      padding: 0 18px;
      border: 1.5px solid var(--ink);
      border-radius: 15px;
      cursor: pointer;
      font-weight: 850;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-secondary {
      background: var(--card);
    }

    .button-primary {
      background: var(--lime);
      box-shadow: 4px 4px 0 var(--ink);
    }

    .button-primary:active {
      box-shadow: 1px 1px 0 var(--ink);
      transform: translate(3px, 3px);
    }

    @media (max-width: 820px) {
      .shell {
        width: min(100% - 28px, 680px);
        padding-top: 20px;
      }

      .topbar {
        margin-bottom: 42px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 37px;
      }

      .sticker {
        min-height: 0;
        padding: 27px;
        transform: rotate(0.5deg);
      }

      .sticker-footer {
        margin-top: 25px;
      }

      .earnings-card {
        margin-top: 48px;
      }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 22px, 500px);
      }

      .topbar {
        margin-bottom: 35px;
      }

      .brand-name {
        font-size: 16px;
      }

      .settings-button {
        width: 46px;
        padding: 0;
      }

      .settings-button span {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }

      h1 {
        font-size: clamp(43px, 16vw, 67px);
      }

      .mobile-break {
        display: block;
      }

      .hero-copy {
        margin-top: 20px;
      }

      .sticker {
        padding: 25px 22px;
        border-radius: 26px;
        box-shadow: 5px 5px 0 var(--ink);
      }

      .earnings-card {
        padding: 25px 19px;
        border-radius: 26px;
      }

      .earnings-head {
        display: block;
      }

      .earnings-controls {
        justify-content: flex-start;
        margin-top: 15px;
      }

      .percent-chip {
        display: inline-block;
      }

      .progress-wrap {
        margin-top: 38px;
      }

      .metrics {
        grid-template-columns: 1fr;
      }

      .metric {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 16px 17px;
      }

      .metric-label {
        margin: 0;
      }

      .metric-value {
        text-align: right;
      }

      .footnote {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .modal-head,
      .settings-form {
        padding-right: 20px;
        padding-left: 20px;
      }

      .time-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .normal-end-time {
        font-size: 11px;
      }

      .progress-times .timeline-caption {
        display: none;
      }

      .overtime-fields {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="牛马鼓励器">
        <span class="brand-mark" aria-hidden="true">牛</span>
        <span class="brand-name">牛马鼓励器</span>
      </div>
      <button class="settings-button" id="open-settings" type="button" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'worker-encourager-settings-v1';
      const PRIVACY_KEY = 'worker-encourager-money-hidden';
      const SIMULATION_DURATION = 14000;
      const DEFAULTS = Object.freeze({
        salary: 12000,
        startTime: '09:00',
        endTime: '18:00',
        overtimeEnabled: false,
        overtimeEndTime: '20:00'
      });
      const money = new Intl.NumberFormat('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const dateFormatter = new Intl.DateTimeFormat('zh-CN', {
        month: 'long', day: 'numeric', weekday: 'long'
      });

      const elements = {
        dialog: document.getElementById('settings-dialog'),
        openSettings: document.getElementById('open-settings'),
        closeSettings: document.getElementById('close-settings'),
        form: document.getElementById('settings-form'),
        salaryInput: document.getElementById('salary-input'),
        startInput: document.getElementById('start-input'),
        endInput: document.getElementById('end-input'),
        overtimeEnabled: document.getElementById('overtime-enabled'),
        overtimeFields: document.getElementById('overtime-fields'),
        overtimeEndInput: document.getElementById('overtime-end-input'),
        resetSettings: document.getElementById('reset-settings'),
        formError: document.getElementById('form-error'),
        previewCaption: document.getElementById('preview-caption'),
        previewDaily: document.getElementById('preview-daily'),
        dateText: document.getElementById('date-text'),
        liveClock: document.getElementById('live-clock'),
        statusDot: document.getElementById('status-dot'),
        quote: document.getElementById('motivational-quote'),
        earningsCard: document.getElementById('earnings-card'),
        earningsLabel: document.getElementById('earnings-label'),
        privacyButton: document.getElementById('privacy-button'),
        privacyButtonText: document.getElementById('privacy-button-text'),
        eyeOpen: document.getElementById('eye-open'),
        eyeClosed: document.getElementById('eye-closed'),
        amount: document.getElementById('earned-amount'),
        percentText: document.getElementById('percent-text'),
        demoButton: document.getElementById('demo-button'),
        progressWrap: document.getElementById('progress-wrap'),
        progressTrack: document.getElementById('progress-track'),
        progressFill: document.getElementById('progress-fill'),
        progressOvertimeFill: document.getElementById('progress-overtime-fill'),
        progressMarker: document.getElementById('progress-marker'),
        progressRunner: document.getElementById('progress-runner'),
        startLabel: document.getElementById('start-label'),
        normalEndTime: document.getElementById('normal-end-time'),
        normalEndLabel: document.getElementById('normal-end-label'),
        endCaption: document.getElementById('end-caption'),
        endLabel: document.getElementById('end-label'),
        dailySalary: document.getElementById('daily-salary'),
        hourlyLabel: document.getElementById('hourly-label'),
        hourlySalary: document.getElementById('hourly-salary'),
        timeLeftLabel: document.getElementById('time-left-label'),
        timeLeft: document.getElementById('time-left'),
        salaryNote: document.getElementById('salary-note')
      };

      let settings = loadSettings();
      let moneyHidden = loadPrivacy();
      const simulation = { active: false, progress: 0, startedAt: 0, animationFrame: null };

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Number(saved.salary) >= 0 && isTime(saved.startTime) && isTime(saved.endTime)) {
            const overtimeEndTime = isTime(saved.overtimeEndTime) ? saved.overtimeEndTime : DEFAULTS.overtimeEndTime;
            const overtimeEnabled = saved.overtimeEnabled === true
              && timeToMinutes(overtimeEndTime) > timeToMinutes(saved.endTime);
            return {
              salary: Number(saved.salary),
              startTime: saved.startTime,
              endTime: saved.endTime,
              overtimeEnabled,
              overtimeEndTime
            };
          }
        } catch (error) {
          // A blocked or malformed local store should never stop the timer.
        }
        return { ...DEFAULTS };
      }

      function loadPrivacy() {
        try {
          return localStorage.getItem(PRIVACY_KEY) === 'true';
        } catch (error) {
          return false;
        }
      }

      function isTime(value) {
        return typeof value === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(value);
      }

      function timeToMinutes(value) {
        const [hours, minutes] = value.split(':').map(Number);
        return hours * 60 + minutes;
      }

      function countWorkdays(year, monthIndex) {
        const days = new Date(year, monthIndex + 1, 0).getDate();
        let total = 0;
        for (let day = 1; day <= days; day += 1) {
          const weekday = new Date(year, monthIndex, day).getDay();
          if (weekday !== 0 && weekday !== 6) total += 1;
        }
        return total;
      }

      function isWorkday(date) {
        const day = date.getDay();
        return day >= 1 && day <= 5;
      }

      function formatDuration(milliseconds) {
        if (milliseconds <= 0) return '可以下班了';
        const totalMinutes = Math.ceil(milliseconds / 60000);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        if (hours && minutes) return `${hours}小时${minutes}分`;
        if (hours) return `${hours}小时`;
        return `${minutes}分钟`;
      }

      function getDayBounds(date, config = settings) {
        const start = new Date(date);
        const regularEnd = new Date(date);
        const timelineEnd = new Date(date);
        const [startHour, startMinute] = config.startTime.split(':').map(Number);
        const [endHour, endMinute] = config.endTime.split(':').map(Number);
        start.setHours(startHour, startMinute, 0, 0);
        regularEnd.setHours(endHour, endMinute, 0, 0);
        if (config.overtimeEnabled) {
          const [overtimeHour, overtimeMinute] = config.overtimeEndTime.split(':').map(Number);
          timelineEnd.setHours(overtimeHour, overtimeMinute, 0, 0);
        } else {
          timelineEnd.setTime(regularEnd.getTime());
        }
        return { start, regularEnd, timelineEnd };
      }

      function getQuote(now, progress, workingToday, start, regularEnd, timelineEnd) {
        if (!workingToday) return '今天不做牛马，认真享受双休。';
        if (now < start) return '工位已就绪，你的时薪还在门口热身。';
        if (settings.overtimeEnabled && now >= timelineEnd) return '终于收工。日薪没变，但你的时间更值钱。';
        if (settings.overtimeEnabled && now >= regularEnd) return '正在加班：工资已封顶，有效时薪正在变薄。';
        if (now >= regularEnd) return '下班！今天的辛苦已经全部到账。';
        if (progress < 0.25) return '开局很稳，每一分钟都在给钱包加码。';
        if (progress < 0.5) return '已进入状态，今天的你正在稳定增值。';
        if (progress < 0.75) return '进度过半，离自由又近了一大截。';
        return '胜利在望，钱包和下班都快追上你了。';
      }

      function update() {
        const now = new Date();
        const workdays = countWorkdays(now.getFullYear(), now.getMonth());
        const daily = workdays ? settings.salary / workdays : 0;
        const { start, regularEnd, timelineEnd } = getDayBounds(now);
        const regularDuration = regularEnd - start;
        const totalDuration = timelineEnd - start;
        const regularHourly = regularDuration > 0 ? daily / (regularDuration / 3600000) : 0;
        const projectedHourly = totalDuration > 0 ? daily / (totalDuration / 3600000) : 0;
        const regularShare = totalDuration > 0 ? (regularDuration / totalDuration) * 100 : 100;
        const realWorkingToday = isWorkday(now);
        const rawProgress = (now - start) / totalDuration;
        const realProgress = realWorkingToday ? Math.min(1, Math.max(0, rawProgress)) : 0;
        const progress = simulation.active ? simulation.progress : realProgress;
        const workingToday = simulation.active ? true : realWorkingToday;
        const displayNow = simulation.active
          ? new Date(start.getTime() + totalDuration * progress)
          : now;
        const earnedProgress = workingToday
          ? Math.min(1, Math.max(0, (displayNow - start) / regularDuration))
          : 0;
        const earned = daily * earnedProgress;
        const elapsedForRate = Math.min(totalDuration, Math.max(regularDuration, displayNow - start));
        const currentEffectiveHourly = elapsedForRate > 0 ? daily / (elapsedForRate / 3600000) : regularHourly;
        const showProjectedRate = settings.overtimeEnabled
          && !simulation.active
          && (!realWorkingToday || now < regularEnd);
        const displayedHourly = showProjectedRate ? projectedHourly : currentEffectiveHourly;
        const progressPercent = progress * 100;
        const runnerPercent = Math.min(100, Math.max(0, progressPercent));
        const maskedMoney = '••••••';

        elements.dateText.textContent = dateFormatter.format(now);
        elements.liveClock.textContent = simulation.active
          ? `模拟 ${displayNow.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false })}`
          : now.toLocaleTimeString('zh-CN', { hour12: false });
        elements.earningsLabel.textContent = simulation.active ? '模拟已赚取' : '已赚取';
        elements.amount.textContent = moneyHidden ? maskedMoney : money.format(earned);
        elements.percentText.textContent = simulation.active
          ? `模拟工时 ${progressPercent.toFixed(1)}%`
          : (workingToday ? `今日工时 ${progressPercent.toFixed(1)}%` : '今日休息 0.0%');
        elements.privacyButton.setAttribute('aria-pressed', String(moneyHidden));
        elements.privacyButton.setAttribute('aria-label', moneyHidden ? '显示所有薪资金额' : '隐藏所有薪资金额');
        elements.privacyButtonText.textContent = moneyHidden ? '显示金额' : '隐藏金额';
        elements.eyeOpen.style.display = moneyHidden ? 'none' : '';
        elements.eyeClosed.style.display = moneyHidden ? '' : 'none';
        elements.demoButton.textContent = simulation.active ? '■ 退出模拟' : '▶ 模拟一天';
        elements.demoButton.setAttribute('aria-pressed', String(simulation.active));
        elements.earningsCard.classList.toggle('is-simulating', simulation.active);
        elements.earningsCard.classList.toggle('is-in-overtime', settings.overtimeEnabled && progressPercent > regularShare);
        elements.progressWrap.style.setProperty('--regular-share', `${regularShare}%`);
        elements.progressFill.style.width = `${Math.min(progressPercent, regularShare)}%`;
        elements.progressOvertimeFill.style.width = `${Math.max(0, progressPercent - regularShare)}%`;
        elements.progressRunner.style.left = `${runnerPercent}%`;
        elements.progressTrack.setAttribute('aria-valuenow', progressPercent.toFixed(1));
        elements.startLabel.textContent = settings.startTime;
        elements.normalEndLabel.textContent = settings.endTime;
        elements.normalEndTime.hidden = !settings.overtimeEnabled;
        elements.progressMarker.hidden = !settings.overtimeEnabled;
        elements.endCaption.textContent = settings.overtimeEnabled ? '加班结束 ' : '下班 ';
        elements.endLabel.textContent = settings.overtimeEnabled ? settings.overtimeEndTime : settings.endTime;
        elements.dailySalary.textContent = moneyHidden ? `¥${maskedMoney}` : `¥${money.format(daily)}`;
        elements.hourlySalary.textContent = moneyHidden ? `¥${maskedMoney}` : `¥${money.format(displayedHourly)}`;
        elements.hourlyLabel.textContent = settings.overtimeEnabled
          ? (showProjectedRate ? '预计加班后时薪' : (displayNow >= regularEnd ? '当前有效时薪' : '正常时薪'))
          : '平均每小时';
        elements.quote.textContent = getQuote(displayNow, progress, workingToday, start, regularEnd, timelineEnd);
        elements.salaryNote.textContent = settings.overtimeEnabled
          ? `按本月 ${workdays} 个工作日折算；加班不增加日薪，仅模拟时薪稀释。`
          : `按本月 ${workdays} 个工作日折算；双休不计薪。`;

        const isActive = simulation.active
          ? progress < 1
          : workingToday && now >= start && now < timelineEnd;
        elements.statusDot.classList.toggle('is-active', isActive);

        if (simulation.active) {
          elements.timeLeftLabel.textContent = settings.overtimeEnabled ? '距离加班结束' : '距离下班';
          elements.timeLeft.textContent = progress >= 1
            ? '模拟完成'
            : formatDuration(totalDuration * (1 - progress));
        } else if (!workingToday) {
          elements.timeLeftLabel.textContent = '今日状态';
          elements.timeLeft.textContent = '今天双休';
        } else if (now < start) {
          elements.timeLeftLabel.textContent = '距离上班';
          elements.timeLeft.textContent = `还有${formatDuration(start - now)}上班`;
        } else if (settings.overtimeEnabled && now < regularEnd) {
          elements.timeLeftLabel.textContent = '距离正常下班';
          elements.timeLeft.textContent = formatDuration(regularEnd - now);
        } else if (settings.overtimeEnabled && now < timelineEnd) {
          elements.timeLeftLabel.textContent = '距离加班结束';
          elements.timeLeft.textContent = formatDuration(timelineEnd - now);
        } else if (settings.overtimeEnabled) {
          elements.timeLeftLabel.textContent = '加班状态';
          elements.timeLeft.textContent = '可以收工了';
        } else {
          elements.timeLeftLabel.textContent = '距离下班';
          elements.timeLeft.textContent = formatDuration(regularEnd - now);
        }
      }

      function stopSimulation() {
        if (simulation.animationFrame) cancelAnimationFrame(simulation.animationFrame);
        simulation.active = false;
        simulation.progress = 0;
        simulation.startedAt = 0;
        simulation.animationFrame = null;
        update();
      }

      function runSimulation() {
        if (simulation.active) {
          stopSimulation();
          return;
        }

        simulation.active = true;
        simulation.progress = 0;
        simulation.startedAt = performance.now();
        update();

        const animate = (timestamp) => {
          simulation.progress = Math.min(1, (timestamp - simulation.startedAt) / SIMULATION_DURATION);
          update();
          if (simulation.progress < 1) {
            simulation.animationFrame = requestAnimationFrame(animate);
          } else {
            simulation.animationFrame = null;
          }
        };

        simulation.animationFrame = requestAnimationFrame(animate);
      }

      function toggleMoneyVisibility() {
        moneyHidden = !moneyHidden;
        try {
          localStorage.setItem(PRIVACY_KEY, String(moneyHidden));
        } catch (error) {
          // Privacy still works for the current visit if storage is unavailable.
        }
        update();
      }

      function syncOvertimeFields() {
        const enabled = elements.overtimeEnabled.checked;
        elements.overtimeFields.hidden = !enabled;
        elements.overtimeEndInput.required = enabled;
      }

      function syncForm(config = settings) {
        elements.salaryInput.value = config.salary;
        elements.startInput.value = config.startTime;
        elements.endInput.value = config.endTime;
        elements.overtimeEnabled.checked = config.overtimeEnabled;
        elements.overtimeEndInput.value = config.overtimeEndTime;
        elements.formError.textContent = '';
        syncOvertimeFields();
        updatePreview();
      }

      function updatePreview() {
        const now = new Date();
        const workdays = countWorkdays(now.getFullYear(), now.getMonth());
        const salary = Number(elements.salaryInput.value) || 0;
        const daily = workdays ? salary / workdays : 0;
        elements.previewCaption.textContent = `本月 ${workdays} 个工作日`;
        if (elements.overtimeEnabled.checked
          && isTime(elements.startInput.value)
          && isTime(elements.overtimeEndInput.value)
          && timeToMinutes(elements.overtimeEndInput.value) > timeToMinutes(elements.startInput.value)) {
          const totalHours = (timeToMinutes(elements.overtimeEndInput.value) - timeToMinutes(elements.startInput.value)) / 60;
          elements.previewDaily.textContent = `加班后 ¥${money.format(daily / totalHours)}/时`;
        } else {
          elements.previewDaily.textContent = `日薪 ¥${money.format(daily)}`;
        }
      }

      function validateForm() {
        const salary = Number(elements.salaryInput.value);
        const startTime = elements.startInput.value;
        const endTime = elements.endInput.value;
        const overtimeEndTime = elements.overtimeEndInput.value;

        if (!Number.isFinite(salary) || salary < 0) return '请输入有效的月薪。';
        if (!isTime(startTime) || !isTime(endTime)) return '请填写完整的上下班时间。';
        if (timeToMinutes(endTime) <= timeToMinutes(startTime)) return '下班时间需要晚于上班时间。';
        if (elements.overtimeEnabled.checked && !isTime(overtimeEndTime)) return '请填写预计加班结束时间。';
        if (elements.overtimeEnabled.checked && timeToMinutes(overtimeEndTime) <= timeToMinutes(endTime)) {
          return '加班结束时间需要晚于正常下班时间。';
        }
        return '';
      }

      elements.openSettings.addEventListener('click', () => {
        syncForm();
        elements.dialog.showModal();
      });

      elements.closeSettings.addEventListener('click', () => elements.dialog.close());

      elements.dialog.addEventListener('click', (event) => {
        if (event.target === elements.dialog) elements.dialog.close();
      });

      elements.form.addEventListener('input', () => {
        syncOvertimeFields();
        updatePreview();
      });
      elements.demoButton.addEventListener('click', runSimulation);
      elements.privacyButton.addEventListener('click', toggleMoneyVisibility);

      elements.form.addEventListener('submit', (event) => {
        event.preventDefault();
        const error = validateForm();
        elements.formError.textContent = error;
        if (error) return;

        settings = {
          salary: Number(elements.salaryInput.value),
          startTime: elements.startInput.value,
          endTime: elements.endInput.value,
          overtimeEnabled: elements.overtimeEnabled.checked,
          overtimeEndTime: elements.overtimeEndInput.value || DEFAULTS.overtimeEndTime
        };

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (error) {
          // The page still works for this visit if local storage is unavailable.
        }

        stopSimulation();
        elements.dialog.close();
      });

      elements.resetSettings.addEventListener('click', () => syncForm(DEFAULTS));

      syncForm();
      update();
      window.setInterval(update, 1000);
    })();
  </script>
</body>
</html>
